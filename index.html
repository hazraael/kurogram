<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KuroGram</title>
    <link rel="manifest" href="/kurogram/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/kurogram/icon-192.png">
    <link rel="apple-touch-icon" href="/kurogram/icon-192.png">
    <meta name="theme-color" content="#4a6b82">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-screen theme-paper">
    <!-- CONTENEUR DE NOTIFICATIONS INTÉGRÉES & DÉBLOCAGES -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <div id="app">
        <!-- EN-TÊTE UNIFIÉ COMPACT -->
        <header class="top-bar">
            <div class="brand-col">
                <div class="brand-line">
                    <h1>KuroGram</h1>
                    <span id="streak-badge">🔥 1j</span>
                    <span id="lives-container" class="hidden">❤️❤️❤️❤️</span>
                </div>
                <div class="sub-status">
                    <span id="mode-label">Mode 0</span>
                    <select id="size-selector" class="size-selector hidden"></select>
                </div>
            </div>

            <div class="header-actions">
                <div id="timer-label" class="timer-pill hidden">⏱️ 00:00</div>
                <select id="lang-selector" class="lang-selector" title="Language / Langue / Idioma">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="es">🇪🇸 ES</option>
                </select>
                <button id="btn-help" class="icon-btn help-btn">?</button>
                <button id="btn-new-grid" class="icon-btn">🔄</button>
                <button id="btn-daily" class="icon-btn">📅</button>
                <button id="btn-menu" class="icon-btn menu-btn">
                    ☰<span id="menu-unlock-dot" class="unlock-dot hidden"></span>
                </button>
            </div>
        </header>

        <!-- BANDEAU TUTORIEL / GUIDAGE (Modes 0 et 1 uniquement) -->
        <div id="guide-banner" class="guide-banner hidden">
            <span id="guide-text"></span>
        </div>

        <!-- PLATEAU DE JEU 2.5D AUTO-ADAPTATIF -->
        <main class="board-wrapper" id="board-wrapper">
            <div id="grid-container" class="grid-container"></div>
        </main>

        <!-- ZONE DE CONTRÔLES TOUJOURS VISIBLE EN BAS -->
        <section class="controls-area">
            <div class="input-modes">
                <button id="tool-num" class="tool-btn active" data-i18n="toolNum">✍️ Chiffre</button>
                <button id="tool-note" class="tool-btn" data-i18n="toolNote">✏️ Notes</button>
                <button id="action-wall" class="tool-btn wall-action-btn" data-i18n="toolWall">⬛ Mur</button>
                <button id="btn-verify" class="tool-btn verify-btn" data-i18n="toolVerify">✔️ Vérifier</button>
            </div>

            <!-- PAVÉ NUMÉRIQUE COMPACT -->
            <div id="numpad" class="numpad"></div>

            <!-- BARRE DES 3 BONUS + CRÉDIT INTÉGRÉ -->
            <div id="bonus-bar" class="bonus-bar">
                <button id="bonus-hammer" class="bonus-btn">
                    <span class="bonus-icon" id="icon-b1">🔨</span>
                    <span class="bonus-name" id="name-b1">Tampon</span>
                    <span class="bonus-count" id="count-b1">3</span>
                </button>
                <button id="bonus-quill" class="bonus-btn">
                    <span class="bonus-icon" id="icon-b2">🪶</span>
                    <span class="bonus-name" id="name-b2">Plume</span>
                    <span class="bonus-count" id="count-b2">2</span>
                </button>
                <button id="bonus-pencil" class="bonus-btn">
                    <span class="bonus-icon" id="icon-b3">✏️</span>
                    <span class="bonus-name" id="name-b3">Crayon</span>
                    <span class="bonus-count" id="count-b3">3</span>
                </button>
            </div>
            <footer class="credits" id="footer-credits">
                <span data-i18n="createdBy">Créé par</span> <strong>Hazraael</strong> • <span id="save-indicator" data-i18n="saved">💾 Sauvegardé</span>
            </footer>
        </section>
    </div>

    <!-- MODALE : CARROUSEL VISUEL DES 3 RÈGLES (INJECTÉ PAR I18N.JS) -->
    <div id="modal-rules" class="modal hidden">
        <div class="modal-content rules-modal-content">
            <div class="rules-header">
                <h2 data-i18n="rulesModalTitle">📖 Les 3 Règles d'Or</h2>
                <span class="swipe-hint" data-i18n="swipeHint">Glissez ou utilisez ◀ ▶</span>
            </div>

            <div id="rules-carousel" class="rules-carousel">
                <div class="rule-slide" data-slide="0"></div>
                <div class="rule-slide hidden" data-slide="1"></div>
                <div class="rule-slide hidden" data-slide="2"></div>
            </div>

            <div class="carousel-nav">
                <button id="rule-prev" class="carousel-arrow">◀</button>
                <div class="carousel-dots">
                    <button class="carousel-dot active" data-dot="0"></button>
                    <button class="carousel-dot" data-dot="1"></button>
                    <button class="carousel-dot" data-dot="2"></button>
                </div>
                <button id="rule-next" class="carousel-arrow">▶</button>
            </div>

            <div class="rules-footer-actions">
                <button id="btn-close-rules" class="primary-btn" data-i18n="rulesCloseBtn">J'ai compris ! Fermer ✕</button>
                <button id="btn-rules-start-tuto" class="secondary-btn hidden" data-i18n="rulesStartTutoBtn">🎓 Faire le tutoriel guidé (Mode 0)</button>
            </div>
        </div>
    </div>

    <!-- MODALE : QUESTION AVANT LE PUZZLE DU JOUR -->
    <div id="modal-daily-check" class="modal hidden">
        <div class="modal-content center">
            <h2 data-i18n="dailyCheckTitle">📅 Défi du Jour (5x5)</h2>
            <p id="daily-check-desc"></p>
            <div class="end-actions">
                <button id="btn-daily-know-yes" class="primary-btn" data-i18n="dailyKnowYes"></button>
                <button id="btn-daily-know-no" class="secondary-btn" data-i18n="dailyKnowNo"></button>
                <button id="btn-daily-cancel" class="close-modal-btn" data-i18n="cancel"></button>
            </div>
        </div>
    </div>

    <!-- MENU UNIQUE CENTRALISÉ -->
    <div id="modal-hub" class="modal hidden">
        <div class="modal-content">
            <div class="hub-tabs">
                <button class="hub-tab active" data-tab="tab-modes" data-i18n="tabModes">⚙️ Modes</button>
                <button class="hub-tab" data-tab="tab-stats" data-i18n="tabStats">📊 Stats</button>
                <button class="hub-tab" data-tab="tab-themes" data-i18n="tabThemes">🏆 Thèmes</button>
            </div>

            <!-- ONGLET 1 : MODES & PARAMÈTRES -->
            <div id="tab-modes" class="tab-pane">
                <div class="mode-list" id="mode-list"></div>
                <hr>
                <label class="toggle-row">
                    <span data-i18n="engravedToggle">Chiffres gravés 🔒 dans les murs (Modes 0-3)</span>
                    <input type="checkbox" id="toggle-engraved" checked>
                </label>
                <div class="dev-unlock-box">
                    <input type="text" id="secret-code-input" placeholder="Code...">
                    <button id="btn-secret-code" class="primary-btn" data-i18n="validate">Valider</button>
                </div>
                <button id="btn-player-reset" class="danger-btn" style="margin-top:4px;" data-i18n="resetProgressBtn"></button>

                <!-- ZONE DE TEST MASQUÉE PAR DÉFAUT -->
                <div id="debug-zone" class="debug-zone hidden">
                    <strong data-i18n="devToolsTitle">🛠️ Outils Développeur (Test) :</strong>
                    <div class="debug-actions">
                        <button id="btn-debug-unlock" class="secondary-btn" data-i18n="debugUnlockBtn"></button>
                        <button id="btn-debug-reset" class="danger-btn" data-i18n="debugResetBtn"></button>
                    </div>
                </div>
            </div>

            <!-- ONGLET 2 : STATISTIQUES PERSONNELLES -->
            <div id="tab-stats" class="tab-pane hidden">
                <div class="stats-filter-row">
                    <label for="stats-size-filter"><strong data-i18n="statsShowLabel">Afficher :</strong></label>
                    <select id="stats-size-filter" class="size-selector"></select>
                </div>
                <div id="stats-grid" class="stats-grid"></div>
                <div id="stats-details" class="stats-details"></div>
            </div>

            <!-- ONGLET 3 : THÈMES & HAUTS-FAITS -->
            <div id="tab-themes" class="tab-pane hidden">
                <h3 data-i18n="themesTitle">Thèmes Visuels</h3>
                <div id="theme-selector" class="theme-list"></div>
                <h3 data-i18n="achievementsTitle">Hauts-Faits</h3>
                <div id="achievements-list" class="achievements-list"></div>
            </div>

            <button class="close-modal-btn" data-close="modal-hub" data-i18n="closeEsc">Fermer (Échap)</button>
        </div>
    </div>

    <!-- MODALE : VICTOIRE / DÉFAITE -->
    <div id="modal-end" class="modal hidden">
        <div class="modal-content center">
            <h2 id="end-title"></h2>
            <p id="end-message"></p>
            <div id="end-ad-info" class="ad-limit-box hidden"></div>
            <div class="end-actions">
                <button id="btn-extra-life" class="secondary-btn hidden"></button>
                <button id="btn-next-level" class="primary-btn"></button>
            </div>
        </div>
    </div>

    <!-- MODALE : CONFIRMATION INTÉGRÉE -->
    <div id="modal-confirm" class="modal hidden">
        <div class="modal-content center">
            <h2 id="confirm-title"></h2>
            <p id="confirm-message"></p>
            <div class="end-actions">
                <button id="btn-confirm-yes" class="primary-btn" data-i18n="confirm"></button>
                <button id="btn-confirm-no" class="close-modal-btn" data-i18n="cancel"></button>
            </div>
        </div>
    </div>

    <!-- MODALE : PUBLICITÉ RÉCOMPENSÉE -->
    <div id="modal-ad" class="modal hidden">
        <div class="modal-content center">
            <h2 id="ad-modal-title"></h2>
            <p id="ad-modal-desc"></p>
            <div id="ad-video-box" class="ad-video-box hidden">
                <div class="ad-spinner">⏳</div>
                <div id="ad-countdown-text"></div>
            </div>
            <div class="end-actions" id="ad-modal-buttons">
                <button id="btn-watch-ad" class="secondary-btn" data-i18n="adWatchBtn"></button>
                <button id="btn-cancel-ad" class="close-modal-btn" data-i18n="cancel"></button>
            </div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="game.js"></script>
</body>
</html>
